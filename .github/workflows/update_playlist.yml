name: Auto Update Playlist

on:
  workflow_dispatch: # Tombol untuk menjalankan manual
  schedule:
    - cron: '0 10 * * *' # Menjalankan setiap hari jam 18:00 UTC (01:00 WIB)

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub requests

      - name: Run update script
        env:
          GITHUB_PAT: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: python update_github_file.py # Pastikan file script python ada di root repo
